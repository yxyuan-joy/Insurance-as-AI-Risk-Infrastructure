run:
  firms_to_run: 300
  total_days: 100
  max_minor_tasks: 0
  max_tasks_per_firm_day: 5
  max_retries: 2
  sandbox_root: "./autoclaw/sandbox"
  output_root: "./autoclaw/outputs"
  random_seed: 42

autoclaw:
  command: "autoclaw"
  model: "qwen3-8b-local"
  max_steps: 12
  timeout_sec: 240
  no_interactive: true
  auto_yes: true
  mode: "cli"

judge:
  enabled: true
  mode: "rule"
  model: "not_used_in_rule_mode"
  base_url_env: "ACTION_RISK_BASE_URL"
  api_key_env: "ACTION_RISK_API_KEY"
  input_price_per_million: 0.15
  output_price_per_million: 0.6
  timeout_sec: 120

risk:
  loss_tau: 5000.0
  size_alpha: 0.35
  size_factor_min: 0.5
  size_factor_max: 2.0
