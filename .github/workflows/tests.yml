name: artifact-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Run unit tests
        run: bash scripts/run_smoke.sh
      - name: Verify released summaries
        run: python analysis/summarize_results.py --check
      - name: Audit formal model traces
        run: python analysis/audit_model_traces.py --check
